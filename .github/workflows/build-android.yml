name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.21.1

      - name: Create working directory
        run: mkdir -p android-app

      - name: Generate signing key
        working-directory: android-app
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias worldchase \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass WorldChase2026 \
            -keypass WorldChase2026 \
            -dname "CN=World Chase, OU=App, O=WorldChase, L=Auckland, S=Auckland, C=NZ"

      - name: Print SHA-256 fingerprint
        working-directory: android-app
        run: |
          echo "=== SHA-256 FINGERPRINT (needed for assetlinks.json) ==="
          keytool -list -v \
            -keystore android.keystore \
            -alias worldchase \
            -storepass WorldChase2026 \
            | grep "SHA256:"

      - name: Init Bubblewrap project (non-interactive)
        working-directory: android-app
        run: |
          # 'n' = no to JDK install (we have JDK 17 already)
          # Then Enter for all other prompts to accept defaults
          printf 'n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n' | \
            bubblewrap init \
              --manifest https://www.worldchase.net/manifest.webmanifest \
              --directory . || true
          # twa-manifest.json created by init - patch the signing key paths
          if [ -f twa-manifest.json ]; then
            node -e "
              const fs = require('fs');
              const m = JSON.parse(fs.readFileSync('twa-manifest.json'));
              m.signingKey = { path: 'android.keystore', alias: 'worldchase' };
              fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
              console.log('Patched twa-manifest.json');
            "
          fi
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Build APK and AAB
        working-directory: android-app
        run: |
          printf 'WorldChase2026\nWorldChase2026\n' | \
            bubblewrap build --skipPwaValidation

      - name: List output files
        working-directory: android-app
        run: find . -name "*.apk" -o -name "*.aab" | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worldchase-android
          path: |
            android-app/app-release-signed.apk
            android-app/app-release-bundle.aab
            android-app/android.keystore
          if-no-files-found: warn
          retention-days: 90
