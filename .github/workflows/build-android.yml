name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.21.1

      - name: Create working directory
        run: mkdir -p android-app

      - name: Generate signing key
        working-directory: android-app
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias worldchase \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass WorldChase2026 \
            -keypass WorldChase2026 \
            -dname "CN=World Chase, OU=App, O=WorldChase, L=Auckland, S=Auckland, C=NZ"

      - name: Print signing key fingerprint
        working-directory: android-app
        run: |
          echo "=== SHA-256 FINGERPRINT (needed for assetlinks.json) ==="
          keytool -list -v \
            -keystore android.keystore \
            -alias worldchase \
            -storepass WorldChase2026 \
            | grep "SHA256:"

      - name: Init Bubblewrap project
        working-directory: android-app
        run: |
          bubblewrap init \
            --manifest https://www.worldchase.net/manifest.webmanifest \
            --directory . \
            --packageId net.worldchase.app \
            --host www.worldchase.net \
            --name "World Chase" \
            --launcherName "WorldChase" \
            --themeColor "#0B1628" \
            --backgroundColor "#0B1628" \
            --startUrl "/dashboard" \
            --orientation "portrait" \
            --signingKeyPath android.keystore \
            --signingKeyAlias worldchase

      - name: Build APK and AAB
        working-directory: android-app
        run: bubblewrap build --skipPwaValidation

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worldchase-android
          path: |
            android-app/app-release-signed.apk
            android-app/app-release-bundle.aab
            android-app/android.keystore
          retention-days: 90
