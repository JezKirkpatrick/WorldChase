name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install build tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "=== SDK path: $SDK ==="
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools" 2>&1 | tail -5

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.24.1

      - name: Pre-configure Bubblewrap
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
          echo "=== Bubblewrap config ==="
          cat ~/.bubblewrap/config.json

      - name: Create working directory
        run: mkdir -p android-app

      - name: Create twa-manifest.json from web manifest
        working-directory: android-app
        run: |
          python3 << 'PYEOF'
          import json, urllib.request

          resp = urllib.request.urlopen('https://www.worldchase.net/manifest.webmanifest', timeout=30)
          d = json.loads(resp.read())

          theme = d.get('theme_color', '#000000')
          bg = d.get('background_color', '#ffffff')
          name = d.get('name', 'WorldChase')
          start = d.get('start_url', '/')

          icons = d.get('icons', [])
          icon = None
          for i in icons:
              if '512' in i.get('sizes', ''):
                  icon = i['src']
                  break
          if not icon and icons:
              icon = icons[0]['src']
          if icon and not icon.startswith('http'):
              icon = 'https://www.worldchase.net' + icon
          icon = icon or 'https://www.worldchase.net/icon-512.png'

          manifest = {
              "packageId": "net.worldchase.app",
              "host": "www.worldchase.net",
              "name": name,
              "launcherName": name,
              "display": "standalone",
              "themeColor": theme,
              "navigationColor": theme,
              "navigationColorDark": theme,
              "navigationDividerColor": "#0B1628",
              "navigationDividerColorDark": "#0B1628",
              "backgroundColor": bg,
              "startUrl": start,
              "iconUrl": icon,
              "maskableIconUrl": icon,
              "monochromeIconUrl": "",
              "splashScreenFadeOutDuration": 500,
              "enableNotifications": True,
              "shortcuts": [],
              "generatorApp": "bubblewrap-cli",
              "webManifestUrl": "https://www.worldchase.net/manifest.webmanifest",
              "fallbackType": "customtabs",
              "features": {},
              "alphaDependencies": {},
              "enableSiteSettingsShortcut": True,
              "isChromeOSOnly": False,
              "isMetaQuest": False,
              "fingerprints": [],
              "signingKey": {"path": "android.keystore", "alias": "android"},
              "storeSigningKey": {"path": "upload-keystore.jks", "alias": "upload"},
              "minSdkVersion": 21,
              "orientation": "portrait",
              "fullScopeUrl": "https://www.worldchase.net/",
              "appVersion": "1",
              "appVersionCode": 1,
              "shareTarget": None,
              "additionalTrustedOrigins": [],
              "retainedBundles": []
          }

          with open('twa-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)

          print(f"Created twa-manifest.json: name={name}, theme={theme}, icon={icon}")
          PYEOF
          echo "--- twa-manifest.json ---"
          cat twa-manifest.json

      - name: Generate keystores
        working-directory: android-app
        run: |
          keytool -genkeypair \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=WorldChase, OU=WorldChase, O=WorldChase, L=London, ST=England, C=US" \
            -noprompt

          keytool -genkeypair \
            -keystore upload-keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=WorldChase, OU=WorldChase, O=WorldChase, L=London, ST=England, C=US" \
            -noprompt

          echo "=== SHA-256 FINGERPRINT ==="
          keytool -list -v -keystore android.keystore -storepass android | grep "SHA256:"

      - name: Build APK and AAB
        working-directory: android-app
        timeout-minutes: 15
        run: |
          which expect || sudo apt-get install -y expect

          cat > /tmp/build.exp << 'SCRIPT_END'
          set timeout 300
          spawn bubblewrap build --skipPwaValidation
          while {1} {
              expect {
                  -re {Y/n}         { send "Y\r" }
                  -re {[Pp]assword} { send "android\r" }
                  timeout           { set timeout -1; exp_continue }
                  eof               { break }
              }
          }
          SCRIPT_END

          expect /tmp/build.exp

      - name: Find output files
        working-directory: android-app
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK/AAB found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worldchase-android
          path: |
            android-app/app-release-signed.apk
            android-app/app-release-bundle.aab
            android-app/android.keystore
            android-app/upload-keystore.jks
          if-no-files-found: warn
          retention-days: 90
