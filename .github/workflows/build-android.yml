name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install build tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "=== SDK path: $SDK ==="
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "platform-tools" 2>&1 | tail -5

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.24.1

      - name: Pre-configure Bubblewrap (skip JDK/SDK prompts)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
          echo "=== Bubblewrap config ==="
          cat ~/.bubblewrap/config.json

      - name: Create working directory
        run: mkdir -p android-app

      - name: Init Bubblewrap project
        working-directory: android-app
        timeout-minutes: 8
        run: |
          yes "" | bubblewrap init \
            --manifest https://www.worldchase.net/manifest.webmanifest \
            --directory . 2>&1 || true
          echo "--- twa-manifest.json ---"
          cat twa-manifest.json 2>/dev/null || echo "NOT CREATED"

      - name: Print SHA-256 fingerprint
        working-directory: android-app
        run: |
          KEYSTORE=$(find . -name "*.keystore" 2>/dev/null | head -1)
          if [ -n "$KEYSTORE" ]; then
            echo "=== Keystore: $KEYSTORE ==="
            echo "=== SHA-256 FINGERPRINT ==="
            keytool -list -v -keystore "$KEYSTORE" -storepass "" 2>/dev/null | grep "SHA256:" || \
            keytool -list -v -keystore "$KEYSTORE" -storepass "android" 2>/dev/null | grep "SHA256:" || \
            echo "Could not read fingerprint"
          else
            echo "No keystore found"
          fi

      - name: Build APK and AAB (no changes to apply, empty password keystore)
        working-directory: android-app
        timeout-minutes: 15
        run: |
          printf '\n\n\n\n\n\n' | bubblewrap build --skipPwaValidation

      - name: Find output files
        working-directory: android-app
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK/AAB found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worldchase-android
          path: |
            android-app/app-release-signed.apk
            android-app/app-release-bundle.aab
            android-app/*.keystore
          if-no-files-found: warn
          retention-days: 90
