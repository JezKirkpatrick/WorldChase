name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.24.1

      - name: Pre-configure Bubblewrap (skip JDK/SDK prompts)
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Create working directory
        run: mkdir -p android-app

      - name: Generate signing key
        working-directory: android-app
        run: |
          keytool -genkeypair \
            -v \
            -keystore android.keystore \
            -alias worldchase \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass WorldChase2026 \
            -keypass WorldChase2026 \
            -dname "CN=World Chase, OU=App, O=WorldChase, L=Auckland, S=Auckland, C=NZ"

      - name: Print SHA-256 fingerprint
        working-directory: android-app
        run: |
          echo "=== SHA-256 FINGERPRINT (needed for assetlinks.json) ==="
          keytool -list -v \
            -keystore android.keystore \
            -alias worldchase \
            -storepass WorldChase2026 \
            | grep "SHA256:"

      - name: Init Bubblewrap project
        working-directory: android-app
        run: |
          yes "" | bubblewrap init \
            --manifest https://www.worldchase.net/manifest.webmanifest \
            --directory . 2>&1 || true
          ls -la

      - name: Patch signing key in twa-manifest.json
        working-directory: android-app
        run: |
          if [ -f twa-manifest.json ]; then
            node -e "
              const fs = require('fs');
              const m = JSON.parse(fs.readFileSync('twa-manifest.json'));
              m.signingKey = { path: 'android.keystore', alias: 'worldchase' };
              fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
              console.log('signingKey patched');
              console.log('packageId:', m.packageId);
            "
          else
            echo "ERROR: twa-manifest.json not created"
            exit 1
          fi

      - name: Build APK and AAB
        working-directory: android-app
        run: |
          printf '\nWorldChase2026\nWorldChase2026\nWorldChase2026\nWorldChase2026\nWorldChase2026\nWorldChase2026\n' | \
            bubblewrap build --skipPwaValidation

      - name: Find output files
        working-directory: android-app
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worldchase-android
          path: |
            android-app/app-release-signed.apk
            android-app/app-release-bundle.aab
            android-app/android.keystore
          if-no-files-found: warn
          retention-days: 90
