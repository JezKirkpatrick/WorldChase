<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>WorldChase Icon</title>
  <rect width="512" height="512" rx="80" fill="#0a0f1e"/>
  <!-- Globe base -->
  <circle cx="256" cy="256" r="160" fill="#0d1a3a" stroke="#1e6fff" stroke-width="5"/>
  <!-- Latitude lines -->
  <ellipse cx="256" cy="256" rx="160" ry="50" fill="none" stroke="#1e6fff" stroke-width="2.5" opacity="0.5"/>
  <ellipse cx="256" cy="210" rx="138" ry="30" fill="none" stroke="#1e6fff" stroke-width="2" opacity="0.3"/>
  <ellipse cx="256" cy="302" rx="138" ry="30" fill="none" stroke="#1e6fff" stroke-width="2" opacity="0.3"/>
  <!-- Longitude line -->
  <ellipse cx="256" cy="256" rx="55" ry="160" fill="none" stroke="#1e6fff" stroke-width="2.5" opacity="0.5"/>
  <!-- Crosshair lines -->
  <line x1="80" y1="256" x2="196" y2="256" stroke="#ff6b2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="316" y1="256" x2="432" y2="256" stroke="#ff6b2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="80" x2="256" y2="196" stroke="#ff6b2b" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="316" x2="256" y2="432" stroke="#ff6b2b" stroke-width="6" stroke-linecap="round"/>
  <!-- Crosshair circle -->
  <circle cx="256" cy="256" r="32" fill="none" stroke="#ff6b2b" stroke-width="5"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="8" fill="#ff6b2b"/>
  <!-- Token dots -->
  <circle cx="210" cy="220" r="6" fill="#ffd700" opacity="0.9"/>
  <circle cx="295" cy="272" r="6" fill="#ffd700" opacity="0.9"/>
  <circle cx="232" cy="290" r="6" fill="#ffd700" opacity="0.7"/>
  <!-- Compass ticks -->
  <line x1="256" y1="88" x2="256" y2="104" stroke="#1e6fff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="408" x2="256" y2="424" stroke="#1e6fff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="88" y1="256" x2="104" y2="256" stroke="#1e6fff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="408" y1="256" x2="424" y2="256" stroke="#1e6fff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
